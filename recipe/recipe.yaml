context:
  version: "4.9"

package:
  name: chrony
  version: ${{ version }}

source:
  url: https://chrony-project.org/releases/chrony-${{ version }}.tar.gz
  sha256: 4924c6f530105bcd5b9e9e33c48a2ae1bfd889222c8480bc41601110efc864d0

build:
  number: 0
  skip:
    - win
  script:
    - ./configure --prefix=$PREFIX --localstatedir=$PREFIX/var
    - make
    - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
    - pkg-config
  host:
    - gnutls
    - nettle
    - if: linux
      then:
        - libedit
  run:
    - gnutls
    - nettle
    - if: linux
      then:
        - libedit

tests:
  - script:
      - test -f $PREFIX/sbin/chronyd
      - test -f $PREFIX/bin/chronyc
      - $PREFIX/sbin/chronyd -v 2>&1 | grep -i chrony
      - $PREFIX/bin/chronyc -v

about:
  homepage: https://chrony-project.org
  license: GPL-2.0-only
  license_file: COPYING
  summary: Versatile implementation of the Network Time Protocol (NTP)
  description: |
    Chrony is a versatile implementation of the Network Time Protocol (NTP).
    It can synchronise the system clock with NTP servers, reference clocks,
    and manual input using wristwatch and keyboard.
  repository: https://gitlab.com/chrony/chrony

extra:
  recipe-maintainers:
    - wep21
